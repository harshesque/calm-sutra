<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalmSutra | Corporate Mindfulness</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #28282B; color: #F4F4F6;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; text-align: center; padding: 20px; overflow: hidden; position: relative;
        }
        .glow {
            position: absolute; width: 500px; height: 500px; border-radius: 50%; pointer-events: none;
            background: radial-gradient(circle, rgba(240,128,0,0.18) 0%, rgba(40,40,43,0) 70%);
            transition: transform 4s ease-in-out, opacity 4s ease-in-out; opacity: 0.5;
        }
        .zen { transition: opacity 0.8s ease; z-index: 2; }
        body.zen-on .zen { opacity: 0.1; pointer-events: none; }
        body.zen-on:hover .zen { opacity: 0.9; pointer-events: auto; }
        h1 { font-family: 'Lora', serif; font-size: 2.3rem; color: #FFF; margin-bottom: 6px; }
        p { color: #A1A1AA; font-size: 0.92rem; max-width: 400px; margin-bottom: 22px; }
        .glass {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); padding: 6px; border-radius: 12px; margin-bottom: 12px;
        }
        button {
            font-family: inherit; padding: 8px 13px; font-size: 0.8rem; border: none;
            border-radius: 8px; cursor: pointer; background: transparent; color: #A1A1AA; transition: 0.2s;
        }
        button:hover { color: #FFF; background: rgba(255,255,255,0.06); }
        button.active { background: #F08000; color: #FFF; font-weight: 600; box-shadow: 0 4px 12px rgba(240,128,0,0.3); }
        .circle-container { position: relative; width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; margin: 20px 0; z-index: 2; }
        .halo, .circle {
            position: absolute; width: 130px; height: 130px;
            border-radius: 54% 46% 42% 58% / 60% 45% 55% 40%; animation: morph 8s ease-in-out infinite;
        }
        .halo-1 { background: rgba(240,128,0,0.14); transition: transform 4s ease-in-out 0.15s; }
        .halo-2 { background: rgba(240,128,0,0.07); transition: transform 4s ease-in-out 0.3s; }
        .circle { background: radial-gradient(circle at 30% 30%, #FF9E2C, #F08000); box-shadow: 0 0 35px rgba(240,128,0,0.45); transition: transform 4s ease-in-out; }
        @keyframes morph { 0%, 100% { border-radius: 54% 46% 42% 58% / 60% 45% 55% 40%; } 50% { border-radius: 42% 58% 55% 45% / 45% 60% 40% 55%; } }
        .instruction { position: absolute; display: flex; flex-direction: column; align-items: center; font-size: 1.2rem; font-weight: 700; color: #FFF; pointer-events: none; z-index: 3; }
        .timer-text { font-size: 0.9rem; font-weight: 400; margin-top: 3px; opacity: 0.9; }
        button#startBtn { background: #F08000; color: #FFF; padding: 12px 34px; font-size: 0.95rem; font-weight: 600; border-radius: 10px; z-index: 3; }
        .pills { display: flex; gap: 8px; margin-top: 12px; }
        .pill { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 5px 12px; font-size: 0.75rem; }
        .pill.on { border-color: #F08000; color: #FFF; }
        .stats { margin-top: 14px; font-size: 0.82rem; color: #A1A1AA; display: flex; gap: 14px; justify-content: center; }
        .prompt { margin-top: 16px; font-family: 'Lora', serif; font-style: italic; font-size: 0.9rem; color: #D4D4D8; max-width: 420px; }
        .hint { position: fixed; bottom: 12px; font-size: 0.7rem; color: #71717A; }
    </style>
</head>
<body>

    <h1>CalmSutra</h1>
    <p>Step away from your inbox. Choose a technique below to lower stress and sharpen your focus.</p>

    <div class="controls">
        <button id="boxBtn" class="active" onclick="setMode('box')">Box Breathing (Focus)</button>
        <button id="relaxBtn" onclick="setMode('relax')">4-7-8 (Stress Relief)</button>
    </div>

    <div class="circle-container">
        <div class="circle" id="circle"></div>
        <div class="instruction">
            <span id="instruction">Ready</span>
            <span class="timer-text" id="timerText"></span>
        </div>
    </div>

    <button id="startBtn" onclick="toggleSession()">Start Session</button>
    <div class="cycle-counter" id="cycleCounter">Cycles completed: 0</div>
    <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊 Sound: On</button>


    <script>
        let isRunning = false;
        let mode = 'box';
        let timer;
        let countdownInterval;
        let cycles = 0;
        let soundEnabled = true;
        let audioCtx = null;

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? "🔊 Sound: On" : "🔇 Sound: Off";
        }

        function playChime(type) {
            if (!soundEnabled) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            // Different calming pitches for Inhale, Hold, and Exhale
            const freqs = { 'Inhale': 528, 'Hold': 432, 'Exhale': 396 };
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freqs[type] || 432, audioCtx.currentTime);

            // Soft fade-in and long gentle fade-out like a singing bowl
            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.8);
        }

        const circle = document.getElementById('circle');
        const instruction = document.getElementById('instruction');
        const timerText = document.getElementById('timerText');
        const startBtn = document.getElementById('startBtn');
        const cycleCounter = document.getElementById('cycleCounter');

        function setMode(selected) {
            if (isRunning) toggleSession();
            mode = selected;
            document.getElementById('boxBtn').classList.toggle('active', mode === 'box');
            document.getElementById('relaxBtn').classList.toggle('active', mode === 'relax');
            instruction.innerText = "Ready";
            timerText.innerText = "";
        }

        function toggleSession() {
            if (isRunning) {
                isRunning = false;
                clearTimeout(timer);
                clearInterval(countdownInterval);
                circle.style.transition = "transform 0.5s ease";
                circle.style.transform = "scale(1)";
                instruction.innerText = "Ready";
                timerText.innerText = "";
                startBtn.innerText = "Start Session";
            } else {
                isRunning = true;
                cycles = 0;
                cycleCounter.innerText = "Cycles completed: 0";
                startBtn.innerText = "Stop";
                runCycle();
            }
        }

        function completeCycle() {
            if (!isRunning) return;
            cycles++;
            cycleCounter.innerText = `Cycles completed: ${cycles}`;
            runCycle();
        }

        function runCycle() {
            if (!isRunning) return;
            if (mode === 'box') {
                step("Inhale", 4000, 1.7, () => {
                    step("Hold", 4000, 1.7, () => {
                        step("Exhale", 4000, 1.0, () => {
                            step("Hold", 4000, 1.0, completeCycle);
                        });
                    });
                });
            } else {
                step("Inhale", 4000, 1.7, () => {
                    step("Hold", 7000, 1.7, () => {
                        step("Exhale", 8000, 1.0, completeCycle);
                    });
                });
            }
        }

        function step(text, duration, scale, callback) {
            if (!isRunning) return;
            instruction.innerText = text;
            playChime(text);
            
            clearInterval(countdownInterval);
            let secondsLeft = duration / 1000;
            timerText.innerText = `${secondsLeft}s`;
            
            countdownInterval = setInterval(() => {
                secondsLeft--;
                if (secondsLeft > 0) {
                    timerText.innerText = `${secondsLeft}s`;
                } else {
                    clearInterval(countdownInterval);
                }
            }, 1000);

            circle.style.transition = `transform ${duration / 1000}s ease-in-out`;
            circle.style.transform = `scale(${scale})`;
            timer = setTimeout(callback, duration);
        }
    </script>
</body>
</html>
