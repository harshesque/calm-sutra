<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalmSutra | Corporate Mindfulness</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #28282B;
            --accent: #F08000;
            --accent-light: #FF9E2C;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #F4F4F6;
            --text-muted: #A1A1AA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Breathing Background Glow */
        .ambient-glow {
            position: absolute;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(240, 128, 0, 0.16) 0%, rgba(40, 40, 43, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            transform: scale(0.9);
            opacity: 0.5;
            transition: transform 4s ease-in-out, opacity 4s ease-in-out;
        }

        /* Zen Focus Mode Fading */
        .zen-fade {
            transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 2;
        }

        body.zen-active .zen-fade {
            opacity: 0.12;
            pointer-events: none;
        }

        body.zen-active:hover .zen-fade {
            opacity: 0.85;
            pointer-events: auto;
        }

        h1 {
            font-family: 'Lora', serif;
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #FFFFFF;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 420px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* Glassmorphism Control Groups */
        .control-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 14px;
        }

        button {
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 8px 14px;
            font-size: 0.82rem;
            font-weight: 500;
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.25s ease;
        }

        button:hover {
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.06);
        }

        button.active {
            background-color: var(--accent);
            color: #FFFFFF;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(240, 128, 0, 0.35);
        }

        /* Layered Halo & Organic Lung Bubble */
        .circle-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 25px 0;
            z-index: 2;
        }

        .halo {
            position: absolute;
            width: 135px;
            height: 135px;
            border-radius: 54% 46% 42% 58% / 60% 45% 55% 40%;
            background: rgba(240, 128, 0, 0.14);
            animation: lungMorph 8s ease-in-out infinite;
            pointer-events: none;
        }

        .halo-1 {
            transition: transform 4s ease-in-out 0.15s;
        }

        .halo-2 {
            background: rgba(240, 128, 0, 0.07);
            transition: transform 4s ease-in-out 0.3s;
        }

        .circle {
            width: 135px;
            height: 135px;
            background: radial-gradient(circle at 30% 30%, var(--accent-light), var(--accent));
            border-radius: 54% 46% 42% 58% / 60% 45% 55% 40%;
            animation: lungMorph 8s ease-in-out infinite;
            transition: transform 4s ease-in-out;
            box-shadow: 0 0 40px rgba(240, 128, 0, 0.45);
            z-index: 2;
        }

        @keyframes lungMorph {
            0%, 100% { border-radius: 54% 46% 42% 58% / 60% 45% 55% 40%; }
            50% { border-radius: 42% 58% 55% 45% / 45% 60% 40% 55%; }
        }

        .instruction {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            pointer-events: none;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }

        #instructionText {
            font-size: 1.25rem;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 0.02em;
        }

        .timer-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 3px;
        }

        /* Primary Action & Audio Bar */
        .action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            gap: 14px;
        }

        button#startBtn {
            background-color: var(--accent);
            color: #FFFFFF;
            padding: 13px 38px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(240, 128, 0, 0.35);
        }

        button#startBtn:hover {
            background-color: #D97200;
            transform: translateY(-1px);
        }

        .audio-controls {
            display: flex;
            gap: 10px;
        }

        .pill-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .pill-btn.audio-on {
            border-color: rgba(240, 128, 0, 0.5);
            color: #FFFFFF;
        }

        /* Stats & Micro-Prompts */
        .status-bar {
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .micro-prompt {
            margin-top: 22px;
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 0.95rem;
            color: #D4D4D8;
            min-height: 24px;
            max-width: 440px;
            opacity: 0.85;
        }

        .shortcuts-hint {
            position: fixed;
            bottom: 14px;
            font-size: 0.72rem;
            color: #71717A;
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>

    <div class="ambient-glow" id="ambientGlow"></div>

    <div class="zen-fade">
        <h1>CalmSutra</h1>
        <p class="subtitle">A quiet pause between meetings. Choose your intention and break length below.</p>

        <!-- Context-Aware Breathing Modes -->
        <div class="control-group">
            <button id="boxBtn" class="active" onclick="setMode('box')">Pre-Meeting Focus (4-4-4-4)</button>
            <button id="relaxBtn" onclick="setMode('relax')">Post-Call Decompress (4-7-8)</button>
            <button id="energyBtn" onclick="setMode('energy')">Afternoon Energy (6-0-2-0)</button>
        </div>

        <!-- Time-Based Quick Breaks -->
        <div class="control-group">
            <button class="dur-btn active" onclick="setDuration(60, this)">1 Min</button>
            <button class="dur-btn" onclick="setDuration(180, this)">3 Min</button>
            <button class="dur-btn" onclick="setDuration(300, this)">5 Min</button>
            <button class="dur-btn" onclick="setDuration(0, this)">Open-Ended</button>
        </div>
    </div>

    <!-- Layered Halo & Lung Bubble -->
    <div class="circle-container">
        <div class="halo halo-2" id="halo2"></div>
        <div class="halo halo-1" id="halo1"></div>
        <div class="circle" id="circle"></div>
        <div class="instruction">
            <span id="instructionText">Ready</span>
            <span class="timer-text" id="timerText"></span>
        </div>
    </div>

    <!-- Controls & Audio -->
    <div class="action-area">
        <button id="startBtn" onclick="toggleSession()">Start Session</button>
        
        <div class="audio-controls zen-fade">
            <button class="pill-btn audio-on" id="chimeBtn" onclick="toggleChime()">🔔 Chimes: On</button>
            <button class="pill-btn" id="noiseBtn" onclick="toggleNoise()">🌊 Office Rain: Off</button>
        </div>
    </div>

    <!-- Stats & Desk Micro-Prompts -->
    <div class="zen-fade">
        <div class="status-bar">
            <span id="cycleCounter">Cycles completed: 0</span>
            <span id="sessionRemaining">Break timer: 1:00</span>
        </div>
