<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalmSutra | Corporate Breathing</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #28282B;
            color: #F4F4F6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 { 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: #FFFFFF; 
        }
        p { 
            color: #A1A1AA; 
            margin-bottom: 35px; 
            max-width: 400px; 
            line-height: 1.5;
        }
        .controls { 
            margin-bottom: 12px; 
            display: flex; 
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px; 
        }
        .break-controls {
            margin-bottom: 35px;
            display: flex;
            gap: 8px;
        }
        .break-controls button {
            padding: 6px 14px;
            font-size: 13px;
        }
        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #3F3F46;
            border-radius: 8px;
            cursor: pointer;
            background-color: #36363A;
            color: #E4E4E7;
            transition: all 0.2s;
        }
        button:hover {
            background-color: #424247;
        }
        button.active { 
            background-color: #F08000; 
            color: #FFFFFF; 
            border-color: #F08000;
            font-weight: 600;
        }
        button#startBtn { 
            background-color: #F08000; 
            color: #FFFFFF; 
            border: none;
            margin-top: 35px; 
            padding: 12px 32px; 
            font-size: 16px; 
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(240, 128, 0, 0.3);
        }
        button#startBtn:hover {
            background-color: #D97200;
        }
        .circle-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circle {
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 30% 30%, #FF9E2C, #F08000);
            border-radius: 54% 46% 42% 58% / 60% 45% 55% 40%;
            animation: lungMorph 8s ease-in-out infinite;
            transition: transform 4s ease-in-out;
            box-shadow: 0 0 35px rgba(240, 128, 0, 0.45);
        }
        @keyframes lungMorph {
            0%, 100% { border-radius: 54% 46% 42% 58% / 60% 45% 55% 40%; }
            50% { border-radius: 42% 58% 55% 45% / 45% 60% 40% 55%; }
        }
        .instruction {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 20px;
            font-weight: 700;
            color: #FFFFFF;
            pointer-events: none;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }
        .timer-text {
            font-size: 16px;
            font-weight: 500;
            margin-top: 4px;
            opacity: 0.9;
        }
        .cycle-counter {
            margin-top: 20px;
            font-size: 14px;
            color: #A1A1AA;
        }
                .sound-btn {
            margin-top: 15px;
            padding: 6px 14px;
            font-size: 13px;
            background-color: transparent;
            border: 1px solid #3F3F46;
            color: #A1A1AA;
        }
        .sound-btn:hover {
            color: #FFFFFF;
            border-color: #71717A;
            background-color: #36363A;
        }
    </style>
</head>
<body>

    <h1>CalmSutra</h1>
    <p>Step away from your inbox. Choose a technique below to lower stress and sharpen your focus.</p>

    <div class="controls">
        <button id="boxBtn" class="active" onclick="setMode('box')">Box Breathing (Focus)</button>
        <button id="relaxBtn" onclick="setMode('relax')">4-7-8 (Stress Relief)</button>
    </div>

    <div class="circle-container">
        <div class="circle" id="circle"></div>
        <div class="instruction">
            <span id="instruction">Ready</span>
            <span class="timer-text" id="timerText"></span>
        </div>
    </div>

    <button id="startBtn" onclick="toggleSession()">Start Session</button>
    <div class="cycle-counter" id="cycleCounter">Cycles completed: 0</div>
    <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊 Sound: On</button>


    <script>
        let isRunning = false;
        let mode = 'box';
        let timer;
        let countdownInterval;
        let cycles = 0;
        let soundEnabled = true;
        let audioCtx = null;

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? "🔊 Sound: On" : "🔇 Sound: Off";
        }

        function playChime(type) {
            if (!soundEnabled) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            // Different calming pitches for Inhale, Hold, and Exhale
            const freqs = { 'Inhale': 528, 'Hold': 432, 'Exhale': 396 };
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freqs[type] || 432, audioCtx.currentTime);

            // Soft fade-in and long gentle fade-out like a singing bowl
            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.8);
        }

        const circle = document.getElementById('circle');
        const instruction = document.getElementById('instruction');
        const timerText = document.getElementById('timerText');
        const startBtn = document.getElementById('startBtn');
        const cycleCounter = document.getElementById('cycleCounter');

        function setMode(selected) {
            if (isRunning) toggleSession();
            mode = selected;
            document.getElementById('boxBtn').classList.toggle('active', mode === 'box');
            document.getElementById('relaxBtn').classList.toggle('active', mode === 'relax');
            instruction.innerText = "Ready";
            timerText.innerText = "";
        }

        function toggleSession() {
            if (isRunning) {
                isRunning = false;
                clearTimeout(timer);
                clearInterval(countdownInterval);
                circle.style.transition = "transform 0.5s ease";
                circle.style.transform = "scale(1)";
                instruction.innerText = "Ready";
                timerText.innerText = "";
                startBtn.innerText = "Start Session";
            } else {
                isRunning = true;
                cycles = 0;
                cycleCounter.innerText = "Cycles completed: 0";
                startBtn.innerText = "Stop";
                runCycle();
            }
        }

        function completeCycle() {
            if (!isRunning) return;
            cycles++;
            cycleCounter.innerText = `Cycles completed: ${cycles}`;
            runCycle();
        }

        function runCycle() {
            if (!isRunning) return;
            if (mode === 'box') {
                step("Inhale", 4000, 1.7, () => {
                    step("Hold", 4000, 1.7, () => {
                        step("Exhale", 4000, 1.0, () => {
                            step("Hold", 4000, 1.0, completeCycle);
                        });
                    });
                });
            } else {
                step("Inhale", 4000, 1.7, () => {
                    step("Hold", 7000, 1.7, () => {
                        step("Exhale", 8000, 1.0, completeCycle);
                    });
                });
            }
        }

        function step(text, duration, scale, callback) {
            if (!isRunning) return;
            instruction.innerText = text;
            playChime(text);
            
            clearInterval(countdownInterval);
            let secondsLeft = duration / 1000;
            timerText.innerText = `${secondsLeft}s`;
            
            countdownInterval = setInterval(() => {
                secondsLeft--;
                if (secondsLeft > 0) {
                    timerText.innerText = `${secondsLeft}s`;
                } else {
                    clearInterval(countdownInterval);
                }
            }, 1000);

            circle.style.transition = `transform ${duration / 1000}s ease-in-out`;
            circle.style.transform = `scale(${scale})`;
            timer = setTimeout(callback, duration);
        }
    </script>
</body>
</html>
