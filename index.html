<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalmSutra | Corporate Breathing</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #28282B;
            color: #F4F4F6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 { 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: #FFFFFF; 
        }
        p { 
            color: #A1A1AA; 
            margin-bottom: 35px; 
            max-width: 400px; 
            line-height: 1.5;
        }
        .controls { 
            margin-bottom: 45px; 
            display: flex; 
            gap: 12px; 
        }
        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #3F3F46;
            border-radius: 8px;
            cursor: pointer;
            background-color: #36363A;
            color: #E4E4E7;
            transition: all 0.2s;
        }
        button:hover {
            background-color: #424247;
        }
        button.active { 
            background-color: #F08000; 
            color: #FFFFFF; 
            border-color: #F08000;
            font-weight: 600;
        }
        button#startBtn { 
            background-color: #F08000; 
            color: #FFFFFF; 
            border: none;
            margin-top: 35px; 
            padding: 12px 32px; 
            font-size: 16px; 
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(240, 128, 0, 0.3);
        }
        button#startBtn:hover {
            background-color: #D97200;
        }
        .circle-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circle {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #FF9E2C, #F08000);
            border-radius: 50%;
            transition: transform 4s ease-in-out;
            box-shadow: 0 0 35px rgba(240, 128, 0, 0.45);
        }
        .instruction {
            position: absolute;
            font-size: 20px;
            font-weight: 700;
            color: #FFFFFF;
            pointer-events: none;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <h1>CalmSutra</h1>
    <p>Step away from your inbox. Choose a technique below to lower stress and sharpen your focus.</p>

    <div class="controls">
        <button id="boxBtn" class="active" onclick="setMode('box')">Box Breathing (Focus)</button>
        <button id="relaxBtn" onclick="setMode('relax')">4-7-8 (Stress Relief)</button>
    </div>

    <div class="circle-container">
        <div class="circle" id="circle"></div>
        <div class="instruction" id="instruction">Ready</div>
    </div>

    <button id="startBtn" onclick="toggleSession()">Start Session</button>

    <script>
        let isRunning = false;
        let mode = 'box';
        let timer;
        const circle = document.getElementById('circle');
        const instruction = document.getElementById('instruction');
        const startBtn = document.getElementById('startBtn');

        function setMode(selected) {
            if (isRunning) toggleSession();
            mode = selected;
            document.getElementById('boxBtn').classList.toggle('active', mode === 'box');
            document.getElementById('relaxBtn').classList.toggle('active', mode === 'relax');
            instruction.innerText = "Ready";
        }

        function toggleSession() {
            if (isRunning) {
                isRunning = false;
                clearTimeout(timer);
                circle.style.transition = "transform 0.5s ease";
                circle.style.transform = "scale(1)";
                instruction.innerText = "Ready";
                startBtn.innerText = "Start Session";
            } else {
                isRunning = true;
                startBtn.innerText = "Stop";
                runCycle();
            }
        }

        function runCycle() {
            if (!isRunning) return;
            if (mode === 'box') {
                step("Inhale", 4000, 1.7, () => {
                    step("Hold", 4000, 1.7, () => {
                        step("Exhale", 4000, 1.0, () => {
                            step("Hold", 4000, 1.0, runCycle);
                        });
                    });
                });
            } else {
                step("Inhale", 4000, 1.7, () => {
                    step("Hold", 7000, 1.7, () => {
                        step("Exhale", 8000, 1.0, runCycle);
                    });
                });
            }
        }

        function step(text, duration, scale, callback) {
            if (!isRunning) return;
            instruction.innerText = text;
            circle.style.transition = `transform ${duration / 1000}s ease-in-out`;
            circle.style.transform = `scale(${scale})`;
            timer = setTimeout(callback, duration);
        }
    </script>
</body>
</html>
